<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Финансовые транзакции</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            color: #222222;
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #eeeeee;
        }

        tbody tr:nth-child(even) {
            background-color: #f8f8f8;
        }

        .empty-message {
            margin-top: 20px;
        }
    </style>
</head>

<body>
<h1>Финансовые транзакции</h1>

<form th:action="@{/logout}" method="post">
    <button type="submit">Выйти из системы</button>
</form>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Пользователь</th>
        <th>Категория</th>
        <th>Тип</th>
        <th>Сумма</th>
        <th>Дата транзакции</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.id}">1</td>
        <td th:text="${transaction.user.username}">ivan</td>
        <td th:text="${transaction.category.name}">Еда</td>
        <td th:text="${transaction.type}">EXPENSE</td>
        <td th:text="${transaction.amount}">500.00</td>
        <td th:text="${transaction.transactionDate}">2026-10-20</td>
    </tr>
    </tbody>
</table>

<p class="empty-message"
   th:if="${#lists.isEmpty(transactions)}">
    Транзакций пока нет.
</p>

</body>
</html>
