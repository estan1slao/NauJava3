<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в систему</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 50px auto;
            padding: 0 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        .message {
            color: #176b35;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>

<h1>Вход в систему</h1>

<p class="message" th:if="${param.registered}">
    Регистрация прошла успешно. Теперь войдите в систему.
</p>

<p class="error" th:if="${param.error}">
    Неверный логин или пароль.
</p>

<p class="message" th:if="${param.logout}">
    Вы вышли из системы.
</p>

<form th:action="@{/login}" method="post">

    <label for="username">Логин</label>
    <input id="username"
           type="text"
           name="username"
           required
           autocomplete="username">

    <label for="password">Пароль</label>
    <input id="password"
           type="password"
           name="password"
           required
           autocomplete="current-password">

    <button type="submit">Войти</button>
</form>

<p>
    Нет аккаунта?
    <a th:href="@{/registration}">Зарегистрироваться</a>
</p>

</body>
</html>
